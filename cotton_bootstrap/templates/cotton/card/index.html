{% load i18n %}
<c-vars classes title url />

<div class="card{% if classes %} {{ classes }}{% endif %}" {{ attrs }}>
    <div class="card-body">
        <div class="card-title">
            {% comment %}TODO: Title level or tag should be an option with a default{% endcomment %}
            <h2>{{ title }}</h2>
        </div>

        <div class="card-text">
            <p>{{ slot }}</p>
        </div>

        {% if url %}
            <c-button url="{{ url }}" color="primary">
                {% if button_title %}
                    {{ button_title }}
                {% else %}
                    {% translate "Read more" %}
                {% endif %}
            </c-button>
        {% endif %}
    </div>
</div>
