<c-vars classes title introduction />

<div class="demo-part{% if classes %} {{ classes }}{% endif %}" id="{{ title|slugify }}">
    {% if title %}<h2 class="demo-part-title">{{ title }}</h2>{% endif %}
    {% if introduction %}
        <div class="introduction">
            {{ introduction }}
        </div>
    {% endif %}

    <div class="showcase">
        {{ slot }}
    </div>
</div>
