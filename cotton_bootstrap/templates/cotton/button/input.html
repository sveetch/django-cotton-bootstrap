<c-vars classes tag is color outline disabled url value type="button" />

<input class="btn{% if color %} btn{% if outline is True %}-outline{% endif %}-{{ color }}{% endif %}{% if classes %} {{ classes }}{% endif %}"
   type="{{ type }}"
   value="{% if value %}{{ value }}{% else %}{{ slot|escape }}{% endif %}"{% if disabled is True %} disabled{% endif %} {{ attrs }}>
